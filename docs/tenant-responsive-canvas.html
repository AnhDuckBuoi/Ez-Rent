 if(b.hasAttribute('data-close-home'))$('#home-dialog').close();
 if(homeUi.click(b,e))return;
 if(b.dataset.go){e.preventDefault();state.savedOnly=false;if(b.dataset.go==='booking'){state.time=null;if(state.view==='appointments'){const a=state.records.find(x=>x.id===state.selected);if(a)state.roomId=a.roomId;}}go(b.dataset.go);return}
 if(b.dataset.room){e.preventDefault();state.detailOrigin=state.view==='home'?'home':'search';state.roomId=Number(b.dataset.room);go('detail');return}
 if(b.dataset.save){const id=Number(b.dataset.save);state.saved.has(id)?state.saved.delete(id):state.saved.add(id);render();toast(state.saved.has(id)?'Đã lưu phòng':'Đã bỏ lưu phòng');return}
 if(b.dataset.page){state.page=Number(b.dataset.page);render();window.scrollTo(0,0);return}
 if(b.dataset.clear){state[b.dataset.clear==='price'?'min':b.dataset.clear]='';if(b.dataset.clear==='price')state.max='';state.page=1;render();return}
 if(b.dataset.status){state.filter=b.dataset.status;state.focused=false;render();return}
 if(b.dataset.appointment){state.selected=Number(b.dataset.appointment);state.focused=true;render();if(innerWidth<1200)window.scrollTo(0,0);return}
 if(b.dataset.day!==undefined){state.day=Number(b.dataset.day);state.time=null;render();return}
 if(b.dataset.time!==undefined){state.time=Number(b.dataset.time);const y=scrollY;render();window.scrollTo(0,y);return}
 switch(b.dataset.action){
 case 'saved':state.savedOnly=true;state.keyword='';state.city='';state.min='';state.max='';state.type='';state.page=1;go('search');break;
 case 'clear':{state.keyword='';state.city='';state.min='';state.max='';state.type='';state.page=1;const wasOpen=$('#filter-dialog').open;$('#filter-dialog').close();render();if(wasOpen)$('#main [data-action=open-filter]')?.focus();break;}
 case 'open-filter':$('#dialog-filter-content').innerHTML=filterForm('dialog-filter');$('#filter-dialog').showModal();break;
 case 'close-dialog':b.closest('dialog').close();break;
 case 'photo':$('#large-photo').innerHTML=roomArt(current().id);$('#photo-dialog').showModal();break;
 case 'back-appointments':state.focused=false;render();break;
 case 'back-search':e.preventDefault();go(state.detailOrigin||'search');break;
 case 'send-booking':if(state.time===null||slotStatus(state.time)!=='available')return;{const id=Math.max(...state.records.map(a=>a.id))+1;state.records.unshift({id,roomId:state.roomId,status:'Pending',day:state.day,start:state.time,note:state.note,reply:'',deadline:'09:00 · 15/10'});state.selected=id;state.filter='all';state.view='appointments';state.focused=true;state.time=null;state.note='';render();window.scrollTo(0,0);toast('Đã tạo yêu cầu minh họa. Dữ liệu chỉ trong bản outline.')}break;
 }
});
document.addEventListener('submit',e=>{
 const form=e.target;if(form.id==='search-form'){e.preventDefault();state.keyword=new FormData(form).get('keyword').trim();state.page=1;render();return}
 if(form.classList.contains('filter-form')){e.preventDefault();const data=new FormData(form);if(data.get('min')!==''&&data.get('max')!==''&&Number(data.get('min'))>Number(data.get('max'))){form.elements.max.setCustomValidity('Giá tối đa phải lớn hơn hoặc bằng giá tối thiểu.');form.reportValidity();return}state.city=data.get('city');state.min=data.get('min');state.max=data.get('max');state.type=data.get('type');state.page=1;const wasOpen=$('#filter-dialog').open;$('#filter-dialog').close();render();if(wasOpen)$('#main [data-action=open-filter]')?.focus();}
});
document.addEventListener('input',e=>{if(e.target.id==='booking-note')state.note=e.target.value;const f=e.target.closest('.filter-form');if(f)f.elements.max.setCustomValidity('')});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;state.page=1;render()}});
render();
})();
</script></body></html>
